name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: "node@node24"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        showcase:
          - "block-kit"
          - "messsaging/work-objects"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run tests
        run: |
          cd "${{ matrix.showcase }}"
          npm install
          npm run lint
          npm run check
          npm run test
