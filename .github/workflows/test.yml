name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: "node@node24"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        showcase:
          - "ai/slackbot-mcp-client/no-auth"
          - "ai/slackbot-mcp-client/rich-responses/block-kit"
          - "ai/slackbot-mcp-client/rich-responses/mcp-apps"
          - "ai/slackbot-mcp-client/slack-identity"
          - "block-kit"
          - "methods"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run tests
        shell: bash
        run: |
          shopt -s globstar
          export BASHOPTS npm_config_script_shell=bash
          cd "${{ matrix.showcase }}"
          npm install
          npm run lint
          npm run check
          npm test --if-present
